name: CI

# Gate every PR (and post-merge main) on the checks a contributor runs locally:
# the unit suite, and the end-to-end suite, which drives a real browser over the
# fixture sites. See CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.22.2
      # No browser is needed here, so puppeteer's download is skipped.
      - run: npm ci --ignore-scripts
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.22.2
      - run: npm ci --ignore-scripts
      # Puppeteer's own browser download, run as a step of its own: npm can
      # hold back a dependency's install script, and the suite needs the
      # revision puppeteer pins.
      - name: Install puppeteer's browser
        run: node node_modules/puppeteer/install.mjs
      - run: npm run test:e2e

  # The one check branch protection requires, so adding or renaming a job here
  # needs no settings change.
  conclusion:
    needs: [unit, e2e]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
        run: test "$UNIT" = success && test "$E2E" = success
